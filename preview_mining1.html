<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0076BE"/></marker></defs>
<rect x="0" y="0" width="1920" height="1400" fill="#FFFFFF"/>
<text x="960.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#4277BB">HOW DERO MINING WORKS — THE Σ-BLOCK LOOP</text>
<text x="960.0" y="82" text-anchor="middle" font-size="14" fill="#5A6B7A">The network is the pool: every CPU miner earns — no pools, no ASICs, no trust.  (Σ-block = Sigma block = mini-block)</text>
<rect x="60" y="150" width="400" height="330" rx="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2"/>
<circle cx="60" cy="150" r="17" fill="#1E88E5" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="60" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="72" y="184" font-size="12.5" font-weight="700" fill="#1E88E5">SET UP (5 minutes)</text>
<text x="72" y="205" font-size="11" fill="#22303C">Run derod (the node) + the AstroBWTv3 miner on any CPU. Point</text>
<text x="72" y="221" font-size="11" fill="#22303C">it at your wallet: --integrator-address / --wallet-address.</text>
<text x="72" y="243" font-size="10.5" font-style="italic" fill="#66727E">💡 Mining is open to any PC — no ASICs, no GPUs, no pool.</text>
<rect x="520" y="150" width="400" height="330" rx="10" fill="#FFFFFF" stroke="#FB8C00" stroke-width="2"/>
<circle cx="520" cy="150" r="17" fill="#FB8C00" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="520" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="532" y="184" font-size="12.5" font-weight="700" fill="#FB8C00">SOLVE THE PUZZLE</text>
<text x="532" y="205" font-size="11" fill="#22303C">The miner races to find a Σ-block (mini-block) by solving a</text>
<text x="532" y="221" font-size="11" fill="#22303C">memory-hard puzzle (≈256 MB per thread). Difficulty adjusts</text>
<text x="532" y="237" font-size="11" fill="#22303C">every block to hold the 18 s pace.</text>
<text x="532" y="259" font-size="10.5" font-style="italic" fill="#66727E">💡 A CPU lottery ticket every ~2 seconds.</text>
<rect x="980" y="150" width="400" height="330" rx="10" fill="#FFFFFF" stroke="#FB8C00" stroke-width="2"/>
<circle cx="980" cy="150" r="17" fill="#FB8C00" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="980" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="992" y="184" font-size="12.5" font-weight="700" fill="#FB8C00">WIN A Σ-BLOCK (≈every 2 s)</text>
<text x="992" y="205" font-size="11" fill="#22303C">Found one: your mini-block is gossiped to the network. 9</text>
<text x="992" y="221" font-size="11" fill="#22303C">regular Σ-blocks + a 10th high-difficulty FINAL Σ-block close</text>
<text x="992" y="237" font-size="11" fill="#22303C">the main block at 18 s.</text>
<text x="992" y="259" font-size="10.5" font-style="italic" fill="#66727E">💡 Each Σ-block has a winner — up to 10 miners get paid per block.</text>
<rect x="300" y="620" width="400" height="330" rx="10" fill="#FFFFFF" stroke="#8E24AA" stroke-width="2"/>
<circle cx="300" cy="620" r="17" fill="#8E24AA" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="300" y="625" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="312" y="654" font-size="12.5" font-weight="700" fill="#8E24AA">THE NETWORK CHECKS (18 s block)</text>
<text x="312" y="675" font-size="11" fill="#22303C">The block is erasure-coded (48 chunks, any 16 rebuild it) and</text>
<text x="312" y="691" font-size="11" fill="#22303C">every node re-validates. Rewards are split evenly among the</text>
<text x="312" y="707" font-size="11" fill="#22303C">Σ-block winners + the block integrator.</text>
<text x="312" y="729" font-size="10.5" font-style="italic" fill="#66727E">💡 Everyone double-checks the page before it is bound into the</text>
<text x="312" y="744" font-size="10.5" font-style="italic" fill="#66727E">💡 notebook.</text>
<rect x="760" y="620" width="400" height="330" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<circle cx="760" cy="620" r="17" fill="#2E7D32" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="760" y="625" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<text x="772" y="654" font-size="12.5" font-weight="700" fill="#2E7D32">YOU GET PAID</text>
<text x="772" y="675" font-size="11" fill="#22303C">Your share of reward + fees lands in your encrypted balance.</text>
<text x="772" y="691" font-size="11" fill="#22303C">Big miners win more often; small miners still earn daily. No</text>
<text x="772" y="707" font-size="11" fill="#22303C">pool fees, no trust.</text>
<text x="772" y="729" font-size="10.5" font-style="italic" fill="#66727E">💡 Rewards arrive automatically — the network IS the pool.</text>
<line x1="460" y1="315" x2="520" y2="315" stroke="#0076BE" stroke-width="2.5" marker-end="url(#amb)"/>
<line x1="920" y1="315" x2="980" y2="315" stroke="#0076BE" stroke-width="2.5" marker-end="url(#amb)"/>
<path d="M 1380 340 L 1380 600" stroke="#0076BE" stroke-width="2.5" marker-end="url(#amb)"/>
<text x="1392" y="475" font-size="10.5" font-weight="600" fill="#0076BE" stroke="#FFF" stroke-width="3" paint-order="stroke">the block settles</text>
<line x1="1380" y1="600" x2="500" y2="600" stroke="#0076BE" stroke-width="2.5" marker-end="url(#amb)"/>
<line x1="700" y1="785" x2="760" y2="785" stroke="#0076BE" stroke-width="2.5" marker-end="url(#amb)"/>
<path d="M 1160 640 L 1160 1090" stroke="#0076BE" stroke-width="2.5" marker-end="url(#amb)"/>
<text x="1172" y="870" font-size="10.5" font-weight="600" fill="#0076BE" stroke="#FFF" stroke-width="3" paint-order="stroke">reward + fees</text>
<text x="1440" y="170" font-size="14" font-weight="700" fill="#4277BB">THE MATH OF Σ-BLOCKS</text>
<rect x="1440" y="182" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="204" font-size="12" font-weight="700" fill="#4277BB">~2 s</text>
<text x="1456" y="222" font-size="10.5" fill="#66727E">per Σ-block (mini-block) emission</text>
<rect x="1440" y="246" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="268" font-size="12" font-weight="700" fill="#4277BB">18 s</text>
<text x="1456" y="286" font-size="10.5" fill="#66727E">main block — settles 10 Σ-blocks</text>
<rect x="1440" y="310" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="332" font-size="12" font-weight="700" fill="#4277BB">10</text>
<text x="1456" y="350" font-size="10.5" fill="#66727E">Σ-blocks per block (9 + 1 final)</text>
<rect x="1440" y="374" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="396" font-size="12" font-weight="700" fill="#4277BB">~48,000</text>
<text x="1456" y="414" font-size="10.5" fill="#66727E">Σ-blocks per day (4,800 blocks × 10)</text>
<rect x="1440" y="438" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="460" font-size="12" font-weight="700" fill="#4277BB">88.4 / 10 / 1.6</text>
<text x="1456" y="478" font-size="10.5" fill="#66727E">reward split — miners / integrator / your pool fee</text>
<rect x="1440" y="502" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="524" font-size="12" font-weight="700" fill="#4277BB">≈256 MB</text>
<text x="1456" y="542" font-size="10.5" fill="#66727E">AstroBWTv3 memory per thread · CPU-only, ASIC/GPU resistant</text>
<rect x="1440" y="566" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="588" font-size="12" font-weight="700" fill="#4277BB">every block</text>
<text x="1456" y="606" font-size="10.5" fill="#66727E">difficulty retarget — keeps the 18 s pace</text>
<rect x="1440" y="630" width="430" height="56" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1456" y="652" font-size="12" font-weight="700" fill="#4277BB">every ~4 years</text>
<text x="1456" y="670" font-size="10.5" fill="#66727E">reward halving (7,000,000 blocks) · hard cap ≈20.89M</text>
<text x="40" y="1116" font-size="15" font-weight="700" fill="#4277BB">WHY IT MATTERS</text>
<rect x="40" y="1128" width="1830" height="96" rx="10" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="60" y="1162" font-size="13.5" fill="#22303C">Old mining: small miners earn nothing, pools take 2–5% and centralize power. DERO: your hashrate share of ~48,000 daily Σ-blocks</text>
<text x="60" y="1184" font-size="13.5" fill="#22303C">pays you proportionally — solo, trustless, fair.</text>
<rect x="18" y="1356" width="380" height="34" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2"/><text x="208" y="1378" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">⚠️ DRAFT — community draft: not verified, reviewed, or audited</text></svg></body></html>
