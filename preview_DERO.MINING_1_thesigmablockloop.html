<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="1400" fill="#0B1220"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker></defs>
<rect x="18.0" y="1354.0" width="400.0" height="34.0" rx="10" fill="#2A1216" stroke="#F87171" stroke-width="1.5"/>
<text x="30.0" y="1376.0" font-size="12.5" font-weight="700" fill="#F87171">⚠️ DRAFT — community draft — not verified, reviewed, or audited</text>
<rect x="20.0" y="22.0" width="1880.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="44.0" font-size="12.5" font-weight="700" fill="#26334D">HOW DERO MINING WORKS — THE Σ-BLOCK LOOP</text>
<rect x="20.0" y="66.0" width="1880.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="88.0" font-size="12.5" font-weight="700" fill="#26334D">The network is the pool: every CPU miner earns — no pools, no ASICs, no trust.  (Σ-block = Sigma block = mini-block) · read 1 → 5, then the numbers card</text>
<rect x="60.0" y="150.0" width="400.0" height="330.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="2.0"/>
<text x="72.0" y="172.0" font-size="12.5" font-weight="700" fill="#38BDF8">1 · SET UP (5 minutes)</text>
<text x="72.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Run derod (the node) + the AstroBWTv3 miner on any CPU. Point</text>
<text x="72.0" y="202.0" font-size="10.5" font-weight="400" fill="#5A6B7A">it at your wallet: --integrator-address / --wallet-address.</text>
<text x="72.0" y="217.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="60.0" cy="150.0" rx="17.0" ry="17.0" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="55.0" y="155.0" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text>
<rect x="520.0" y="150.0" width="400.0" height="330.0" rx="10" fill="#141E36" stroke="#FB923C" stroke-width="2.0"/>
<text x="532.0" y="172.0" font-size="12.5" font-weight="700" fill="#FB923C">2 · SOLVE THE PUZZLE</text>
<text x="532.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">The miner races to find a Σ-block (mini-block) by solving a</text>
<text x="532.0" y="202.0" font-size="10.5" font-weight="400" fill="#5A6B7A">memory-hard puzzle (≈256 MB per thread). Difficulty adjusts</text>
<text x="532.0" y="217.0" font-size="10.5" font-weight="400" fill="#5A6B7A">every block to hold the 18 s pace.</text>
<ellipse cx="520.0" cy="150.0" rx="17.0" ry="17.0" fill="#FB923C" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="515.0" y="155.0" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text>
<rect x="980.0" y="150.0" width="400.0" height="330.0" rx="10" fill="#141E36" stroke="#FB923C" stroke-width="2.0"/>
<text x="992.0" y="172.0" font-size="12.5" font-weight="700" fill="#FB923C">3 · WIN A Σ-BLOCK (≈every 2 s)</text>
<text x="992.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Found one: your mini-block is gossiped to the network. 9</text>
<text x="992.0" y="202.0" font-size="10.5" font-weight="400" fill="#5A6B7A">regular Σ-blocks + a 10th high-difficulty FINAL Σ-block close</text>
<text x="992.0" y="217.0" font-size="10.5" font-weight="400" fill="#5A6B7A">the main block at 18 s.</text>
<ellipse cx="980.0" cy="150.0" rx="17.0" ry="17.0" fill="#FB923C" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="975.0" y="155.0" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text>
<rect x="300.0" y="620.0" width="400.0" height="330.0" rx="10" fill="#141E36" stroke="#A78BFA" stroke-width="2.0"/>
<text x="312.0" y="642.0" font-size="12.5" font-weight="700" fill="#A78BFA">4 · THE NETWORK CHECKS (18 s block)</text>
<text x="312.0" y="657.0" font-size="10.5" font-weight="400" fill="#5A6B7A">The block is erasure-coded (48 chunks, any 16 rebuild it) and</text>
<text x="312.0" y="672.0" font-size="10.5" font-weight="400" fill="#5A6B7A">every node re-validates. Rewards are split evenly among the</text>
<text x="312.0" y="687.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Σ-block winners + the block integrator.</text>
<ellipse cx="300.0" cy="620.0" rx="17.0" ry="17.0" fill="#A78BFA" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="295.0" y="625.0" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text>
<rect x="760.0" y="620.0" width="400.0" height="330.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="2.0"/>
<text x="772.0" y="642.0" font-size="12.5" font-weight="700" fill="#34D399">5 · YOU GET PAID</text>
<text x="772.0" y="657.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Your share of reward + fees lands in your encrypted balance.</text>
<text x="772.0" y="672.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Big miners win more often; small miners still earn daily. No</text>
<text x="772.0" y="687.0" font-size="10.5" font-weight="400" fill="#5A6B7A">pool fees, no trust.</text>
<ellipse cx="760.0" cy="620.0" rx="17.0" ry="17.0" fill="#34D399" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="755.0" y="625.0" font-size="12.5" font-weight="700" fill="#FFFFFF">5</text>
<rect x="1440.0" y="150.0" width="300.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="1452.0" y="172.0" font-size="12.5" font-weight="700" fill="#26334D">THE MATH OF Σ-BLOCKS</text>
<rect x="1440.0" y="180.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="202.0" font-size="12.5" font-weight="700" fill="#38BDF8">~2 s  per Σ-block (mini-block) emission</text>
<rect x="1440.0" y="244.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="266.0" font-size="12.5" font-weight="700" fill="#38BDF8">18 s  main block — settles 10 Σ-blocks</text>
<rect x="1440.0" y="308.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="330.0" font-size="12.5" font-weight="700" fill="#38BDF8">10  Σ-blocks per block (9 + 1 final)</text>
<rect x="1440.0" y="372.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="394.0" font-size="12.5" font-weight="700" fill="#38BDF8">~48,000  Σ-blocks per day (4,800 blocks × 10)</text>
<rect x="1440.0" y="436.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="458.0" font-size="12.5" font-weight="700" fill="#38BDF8">88.4 / 10 / 1.6  reward split — miners / integrator / your pool fee</text>
<rect x="1440.0" y="500.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="522.0" font-size="12.5" font-weight="700" fill="#38BDF8">≈256 MB  AstroBWTv3 memory per thread · CPU-only, ASIC/GPU resistant</text>
<rect x="1440.0" y="564.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="586.0" font-size="12.5" font-weight="700" fill="#38BDF8">every block  difficulty retarget — keeps the 18 s pace</text>
<rect x="1440.0" y="628.0" width="430.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="1452.0" y="650.0" font-size="12.5" font-weight="700" fill="#38BDF8">every ~4 years  reward halving (7,000,000 blocks) · hard cap ≈20.89M</text>
<rect x="40.0" y="1095.0" width="260.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="1117.0" font-size="12.5" font-weight="700" fill="#26334D">WHY IT MATTERS</text>
<rect x="40.0" y="1120.0" width="1830.0" height="96.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="52.0" y="1142.0" font-size="12.5" font-weight="700" fill="#38BDF8">Old mining: small miners earn nothing, pools take 2–5% and centralize power. DERO: your hashrate share of ~48,000 daily Σ-blocks pays you proportionally — solo, trustless, fair.</text>
</svg></body></html>
