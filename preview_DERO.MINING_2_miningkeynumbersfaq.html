<rect x="20.0" y="66.0" width="1880.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="88.0" font-size="12.5" font-weight="700" fill="#26334D">Print or share with a non-technical audience — the companion to ‘The Σ-Block Loop’.</text>

<text x="72.0" y="137.0" font-size="12.5" font-weight="700" fill="#26334D">KEY NUMBERS</text>
<rect x="1000.0" y="115.0" width="600.0" height="26.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="1012.0" y="137.0" font-size="12.5" font-weight="700" fill="#26334D">FREQUENTLY ASKED (PLAIN SPEAK)</text>
<rect x="60.0" y="150.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="172.0" font-size="12.5" font-weight="700" fill="#38BDF8">~2 s</text>
<text x="72.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">per Σ-block (mini-block) emission</text>
<rect x="60.0" y="214.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="236.0" font-size="12.5" font-weight="700" fill="#38BDF8">18 s</text>
<text x="72.0" y="251.0" font-size="10.5" font-weight="400" fill="#5A6B7A">main block — settles 10 Σ-blocks</text>
<rect x="60.0" y="278.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="300.0" font-size="12.5" font-weight="700" fill="#38BDF8">10</text>
<text x="72.0" y="315.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Σ-blocks per block (9 + 1 final)</text>
<rect x="60.0" y="342.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="364.0" font-size="12.5" font-weight="700" fill="#38BDF8">~48,000</text>
<text x="72.0" y="379.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Σ-blocks per day (4,800 blocks × 10)</text>
<rect x="60.0" y="406.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="428.0" font-size="12.5" font-weight="700" fill="#38BDF8">88.4 / 10 / 1.6</text>
<text x="72.0" y="443.0" font-size="10.5" font-weight="400" fill="#5A6B7A">reward split — miners / integrator / your pool fee</text>
<rect x="60.0" y="470.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="492.0" font-size="12.5" font-weight="700" fill="#38BDF8">≈256 MB</text>
<text x="72.0" y="507.0" font-size="10.5" font-weight="400" fill="#5A6B7A">AstroBWTv3 memory per thread · CPU-only, ASIC/GPU resistant</text>
<rect x="60.0" y="534.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="556.0" font-size="12.5" font-weight="700" fill="#38BDF8">every block</text>
<text x="72.0" y="571.0" font-size="10.5" font-weight="400" fill="#5A6B7A">difficulty retarget — keeps the 18 s pace</text>
<rect x="60.0" y="598.0" width="880.0" height="56.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="1.5"/>
<text x="72.0" y="620.0" font-size="12.5" font-weight="700" fill="#38BDF8">every ~4 years</text>
<text x="72.0" y="635.0" font-size="10.5" font-weight="400" fill="#5A6B7A">reward halving (7,000,000 blocks) · hard cap ≈20.89M</text>
<rect x="1000.0" y="150.0" width="860.0" height="70.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="1012.0" y="172.0" font-size="12.5" font-weight="700" fill="#26334D">Do I need a mining pool?</text>
<text x="1012.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">No — DERO’s Σ-block system makes the network the pool. Rewards are proportional to your hashrate share.</text>
<rect x="1000.0" y="228.0" width="860.0" height="70.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="1012.0" y="250.0" font-size="12.5" font-weight="700" fill="#26334D">Can I mine on a laptop?</text>
<text x="1012.0" y="265.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Yes — AstroBWTv3 is CPU-only and memory-hard. You win less often than a big rig, but you still earn.</text>
<rect x="1000.0" y="306.0" width="860.0" height="70.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="1012.0" y="328.0" font-size="12.5" font-weight="700" fill="#26334D">How much will I earn?</text>
<text x="1012.0" y="343.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Expected Σ-blocks/day = (your hashrate ÷ network hashrate) × 48,000. Check current hashrate in your daemon.</text>
<rect x="1000.0" y="384.0" width="860.0" height="70.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="1012.0" y="406.0" font-size="12.5" font-weight="700" fill="#26334D">When do I get paid?</text>
<text x="1012.0" y="421.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Rewards are distributed every block (~18 s) to the Σ-block winners, proportional to their work.</text>
<rect x="1000.0" y="462.0" width="860.0" height="70.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="1012.0" y="484.0" font-size="12.5" font-weight="700" fill="#26334D">What is the integrator bonus?</text>
<text x="1012.0" y="499.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Run a daemon with --integrator-address: you get 10% of every block you integrate + 1.6% if you run your own pool.</text>
<rect x="1000.0" y="540.0" width="860.0" height="70.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="1012.0" y="562.0" font-size="12.5" font-weight="700" fill="#26334D">How do I start?</text>
<text x="1012.0" y="577.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Download derod + dero-miner from derod.org, sync the chain, set --integrator-address and --wallet-address, mine.</text>
<rect x="1000.0" y="618.0" width="860.0" height="70.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="1012.0" y="640.0" font-size="12.5" font-weight="700" fill="#26334D">What is crowd mining (EPOCH)?</text>
<text x="1012.0" y="655.0" font-size="10.5" font-weight="400" fill="#5A6B7A">EPOCH lets apps turn user engagement into mining hashes submitted to a DERO node — developers get rewarded without ads or selling data (see DeroBeats).</text>
