<rect x="18.0" y="1354.0" width="400.0" height="34.0" rx="10" fill="#2A1216" stroke="#F87171" stroke-width="1.5"/>
<text x="30.0" y="1376.0" font-size="12.5" font-weight="700" fill="#F87171">⚠️ DRAFT — community draft — not verified, reviewed, or audited</text>
<rect x="20.0" y="22.0" width="1880.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="44.0" font-size="12.5" font-weight="700" fill="#26334D">DERO’S PLACE IN THE MODERN WORLD</text>
<rect x="20.0" y="64.0" width="1880.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="86.0" font-size="12.5" font-weight="700" fill="#26334D">Same everyday needs · completely different plumbing — how the DHEBP stack replaces banks, clouds and middlemen.</text>
<rect x="60.0" y="102.0" width="320.0" height="18.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="72.0" y="124.0" font-size="12.5" font-weight="700" fill="#26334D">what you need</text>
<rect x="420.0" y="102.0" width="320.0" height="18.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="432.0" y="124.0" font-size="12.5" font-weight="700" fill="#26334D">old world — centralized</text>
<rect x="780.0" y="102.0" width="320.0" height="18.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="792.0" y="124.0" font-size="12.5" font-weight="700" fill="#26334D">DERO world — private</text>
<rect x="1140.0" y="102.0" width="320.0" height="18.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="1152.0" y="124.0" font-size="12.5" font-weight="700" fill="#26334D">→ replaced by</text>
<rect x="30.0" y="132.0" width="330.0" height="176.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.5"/>
<text x="42.0" y="154.0" font-size="12.5" font-weight="700" fill="#FBBF24">1 · PAYING SOMEONE</text>
<text x="42.0" y="169.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Send money to anyone, anywhere</text>
<rect x="390.0" y="132.0" width="560.0" height="176.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.5"/>
<text x="402.0" y="154.0" font-size="12.5" font-weight="700" fill="#F87171">Bank or payment app</text>
<text x="402.0" y="169.0" font-size="10.5" font-weight="400" fill="#5A6B7A">They see every payment, can freeze or censor you, charge fees, demand ID.</text>
<text x="402.0" y="184.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 The bank is the referee — and it keeps the ball.</text>
<rect x="980.0" y="132.0" width="630.0" height="176.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.5"/>
<text x="992.0" y="154.0" font-size="12.5" font-weight="700" fill="#34D399">Direct private transfer (DHEBP)</text>
<text x="992.0" y="169.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Amount + identity hidden by homomorphic encryption. Settled in ~1 min, tiny ~2.5 KB tx, tiny fee.</text>
<text x="992.0" y="184.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 Only you and the recipient know what moved.</text>
<rect x="30.0" y="316.0" width="330.0" height="176.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.5"/>
<text x="42.0" y="338.0" font-size="12.5" font-weight="700" fill="#FBBF24">2 · MAKING A DEAL</text>
<text x="42.0" y="353.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Agree on terms both sides will honor</text>
<rect x="390.0" y="316.0" width="560.0" height="176.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.5"/>
<text x="402.0" y="338.0" font-size="12.5" font-weight="700" fill="#F87171">Lawyer, notary or platform</text>
<text x="402.0" y="353.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Holds the money and the trust: slow, costly, and you must trust them.</text>
<text x="402.0" y="368.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 Trust is rented from a third party.</text>
<rect x="980.0" y="316.0" width="630.0" height="176.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.5"/>
<text x="992.0" y="338.0" font-size="12.5" font-weight="700" fill="#34D399">DVM smart contract (DeroScript)</text>
<text x="992.0" y="353.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Code is the escrow: it runs on every node, nobody can break or rewrite it. Escrow, tokens, auctions,</text>
<text x="992.0" y="368.0" font-size="10.5" font-weight="400" fill="#5A6B7A">lotteries.</text>
<text x="992.0" y="383.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 Trust is replaced by math everyone can check.</text>
<rect x="30.0" y="500.0" width="330.0" height="176.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.5"/>
<text x="42.0" y="522.0" font-size="12.5" font-weight="700" fill="#FBBF24">3 · STORING RECORDS</text>
<text x="42.0" y="537.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Keep data safe, private, permanent</text>
<rect x="390.0" y="500.0" width="560.0" height="176.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.5"/>
<text x="402.0" y="522.0" font-size="12.5" font-weight="700" fill="#F87171">Company cloud (AWS, Google…)</text>
<text x="402.0" y="537.0" font-size="10.5" font-weight="400" fill="#5A6B7A">They read, sell, or lose your data; one breach exposes everything.</text>
<text x="402.0" y="552.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 Your data in someone else’s filing cabinet.</text>
<rect x="980.0" y="500.0" width="630.0" height="176.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.5"/>
<text x="992.0" y="522.0" font-size="12.5" font-weight="700" fill="#34D399">Encrypted ledger + GravitonDB</text>
<text x="992.0" y="537.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Accounts are 66 bytes of encrypted state, never decrypted, merkle-proved, prunable to a few GB.</text>
<text x="992.0" y="552.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 A lockbox only you can open.</text>
<rect x="30.0" y="684.0" width="330.0" height="176.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.5"/>
<text x="42.0" y="706.0" font-size="12.5" font-weight="700" fill="#FBBF24">4 · RUNNING AN APP</text>
<text x="42.0" y="721.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Host software people can use</text>
<rect x="390.0" y="684.0" width="560.0" height="176.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.5"/>
<text x="402.0" y="706.0" font-size="12.5" font-weight="700" fill="#F87171">Web server + domain + hosting</text>
<text x="402.0" y="721.0" font-size="10.5" font-weight="400" fill="#5A6B7A">One point of failure: can be blocked, hacked, or switched off.</text>
<text x="402.0" y="736.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 Your shop sits on someone else’s land.</text>
<rect x="980.0" y="684.0" width="630.0" height="176.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.5"/>
<text x="992.0" y="706.0" font-size="12.5" font-weight="700" fill="#34D399">TELA — apps on the chain</text>
<text x="992.0" y="721.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Code and assets live on-chain, served by the network itself. No origin server to attack or censor.</text>
<text x="992.0" y="736.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 Your shop is on everyone’s land — and nobody owns it.</text>
<rect x="30.0" y="868.0" width="330.0" height="176.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.5"/>
<text x="42.0" y="890.0" font-size="12.5" font-weight="700" fill="#FBBF24">5 · PROVING WHO YOU ARE</text>
<text x="42.0" y="905.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Authenticate without being spied on</text>
<rect x="390.0" y="868.0" width="560.0" height="176.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.5"/>
<text x="402.0" y="890.0" font-size="12.5" font-weight="700" fill="#F87171">Passwords + emails + data brokers</text>
<text x="402.0" y="905.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Leaks, phishing, and your identity bought and sold.</text>
<text x="402.0" y="920.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 You flash your whole wallet to prove you’re an adult.</text>
<rect x="980.0" y="868.0" width="630.0" height="176.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.5"/>
<text x="992.0" y="890.0" font-size="12.5" font-weight="700" fill="#34D399">Wallet + DeroAuth + usernames</text>
<text x="992.0" y="905.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Sign in with your wallet (XSWD bridge); the DVM Name Service gives human names; zero-knowledge</text>
<text x="992.0" y="920.0" font-size="10.5" font-weight="400" fill="#5A6B7A">proofs reveal only what’s needed.</text>
<text x="992.0" y="935.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 Prove you’re over 18 without showing your ID.</text>

<text x="1658.0" y="152.0" font-size="12.5" font-weight="700" fill="#26334D">THE DERO TOOLBOX</text>

<text x="1652.0" y="180.0" font-size="12.5" font-weight="700" fill="#2DD4BF">DHEBP · Layer 1</text>
<text x="1652.0" y="195.0" font-size="10.5" font-weight="400" fill="#5A6B7A">encrypted chain · PoW AstroBWTv3 · 18 s blocks</text>
<rect x="1640.0" y="226.0" width="250.0" height="62.0" rx="10" fill="#141E36" stroke="#2DD4BF" stroke-width="1.4"/>

<text x="1652.0" y="263.0" font-size="10.5" font-weight="400" fill="#5A6B7A">smart contracts · DeroScript</text>

<text x="1652.0" y="399.0" font-size="10.5" font-weight="400" fill="#5A6B7A">on-chain apps &amp; web — no server</text>

<text x="1652.0" y="467.0" font-size="10.5" font-weight="400" fill="#5A6B7A">app ↔ wallet bridge</text>
<rect x="1640.0" y="498.0" width="250.0" height="62.0" rx="10" fill="#141E36" stroke="#2DD4BF" stroke-width="1.4"/>
<text x="1652.0" y="520.0" font-size="12.5" font-weight="700" fill="#2DD4BF">DeroAuth / DeroPay</text>
<text x="1652.0" y="535.0" font-size="10.5" font-weight="400" fill="#5A6B7A">sign in · pay with your wallet</text>
<rect x="1640.0" y="566.0" width="250.0" height="62.0" rx="10" fill="#141E36" stroke="#2DD4BF" stroke-width="1.4"/>

<text x="1652.0" y="603.0" font-size="10.5" font-weight="400" fill="#5A6B7A">human usernames on-chain</text>
<rect x="40.0" y="1095.0" width="420.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="1117.0" font-size="12.5" font-weight="700" fill="#26334D">THE SAME JOB — NO MIDDLEMAN</text>
<rect x="40.0" y="1120.0" width="1810.0" height="96.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="52.0" y="1142.0" font-size="12.5" font-weight="700" fill="#">Money, deals, data, apps, identity — the modern world runs them on banks, clouds and platforms. DERO runs them on one shared, private, tamper-proof network: every node does the job, and none of them can see your business.</text>
