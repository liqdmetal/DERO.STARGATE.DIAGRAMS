<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="950" viewBox="0 0 1920 950" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="950" fill="#FFFFFF"/>
<text x="960.0" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#4277BB">THE SAME JOURNEY IN PLAIN WORDS</text>
<text x="960.0" y="82" text-anchor="middle" font-size="13.5" fill="#5A6B7A">Print or share this page with a non-technical audience — the companion to the ‘Journey of One Transaction’ diagram.</text>
<text x="60" y="130" font-size="17" font-weight="700" fill="#4277BB">TECH SPEAK → PLAIN SPEAK</text>
<text x="1180" y="130" font-size="17" font-weight="700" fill="#4277BB">KEY NUMBERS</text>
<rect x="60" y="150" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="172" font-size="12.5" font-weight="700" fill="#22303C">Homomorphic encryption</text>
<text x="76" y="190" font-size="11.5" fill="#66727E">Math you can add and subtract while it’s still locked in a safe — balances stay secret.</text>
<rect x="60" y="210" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="232" font-size="12.5" font-weight="700" fill="#22303C">Ring signatures (ring of 8)</text>
<text x="76" y="250" font-size="11.5" fill="#66727E">You stand in a crowd of 8 people. Nobody can tell which one is you.</text>
<rect x="60" y="270" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="292" font-size="12.5" font-weight="700" fill="#22303C">Zero-knowledge proofs (Bulletproofs)</text>
<text x="76" y="310" font-size="11.5" fill="#66727E">‘Trust me, the math is right’ — proven without revealing any secret.</text>
<rect x="60" y="330" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="352" font-size="12.5" font-weight="700" fill="#22303C">Mempool</text>
<text x="76" y="370" font-size="11.5" fill="#66727E">The waiting room for payments that haven’t been written into the ledger yet.</text>
<rect x="60" y="390" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="412" font-size="12.5" font-weight="700" fill="#22303C">AstroBWTv3 proof-of-work</text>
<text x="76" y="430" font-size="11.5" fill="#66727E">A CPU puzzle lottery that keeps the network honest — any PC can play.</text>
<rect x="60" y="450" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="472" font-size="12.5" font-weight="700" fill="#22303C">Mini-blocks (10 per block)</text>
<text x="76" y="490" font-size="11.5" fill="#66727E">One notebook page has 10 lines — up to 10 miners get paid per page.</text>
<rect x="60" y="510" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="532" font-size="12.5" font-weight="700" fill="#22303C">Erasure-coded blocks (48 → 16)</text>
<text x="76" y="550" font-size="11.5" fill="#66727E">The page is torn into 48 pieces of confetti; any 16 rebuild it. Faster and tougher.</text>
<rect x="60" y="570" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="592" font-size="12.5" font-weight="700" fill="#22303C">DVM + DeroScript</text>
<text x="76" y="610" font-size="11.5" fill="#66727E">Programs (smart contracts) that run on every node and update the encrypted notebook together.</text>
<rect x="60" y="630" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="652" font-size="12.5" font-weight="700" fill="#22303C">66 bytes per account</text>
<text x="76" y="670" font-size="11.5" fill="#66727E">Your whole account state is smaller than this sentence.</text>
<rect x="60" y="690" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="712" font-size="12.5" font-weight="700" fill="#22303C">TLS-encrypted P2P network</text>
<text x="76" y="730" font-size="11.5" fill="#66727E">Nodes talk to each other over a secure, wiretap-proof line.</text>
<rect x="60" y="750" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="772" font-size="12.5" font-weight="700" fill="#22303C">28-byte data payload</text>
<text x="76" y="790" font-size="11.5" fill="#66727E">A tiny note glued to a payment — a message that travels with it.</text>
<rect x="60" y="810" width="1080" height="52" rx="8" fill="#FFFFFF" stroke="#C9D6E3" stroke-width="1.5"/>
<text x="76" y="832" font-size="12.5" font-weight="700" fill="#22303C">18 s blocks / ~1 min confirmation</text>
<text x="76" y="850" font-size="11.5" fill="#66727E">A new page every 18 seconds; your payment is officially settled in about a minute.</text>
<rect x="1180" y="150" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="174" font-size="15" font-weight="700" fill="#4277BB">18 s</text>
<text x="1210" y="193" font-size="11.5" fill="#66727E">average block time</text>
<rect x="1180" y="210" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="234" font-size="15" font-weight="700" fill="#4277BB">10 (9+1)</text>
<text x="1210" y="253" font-size="11.5" fill="#66727E">mini-blocks per block (≈1 every 2 s)</text>
<rect x="1180" y="270" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="294" font-size="15" font-weight="700" fill="#4277BB">8</text>
<text x="1210" y="313" font-size="11.5" fill="#66727E">default ring size (anonymity set)</text>
<rect x="1180" y="330" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="354" font-size="15" font-weight="700" fill="#4277BB">~2.5 KB</text>
<text x="1210" y="373" font-size="11.5" fill="#66727E">transaction size (ring 8)</text>
<rect x="1180" y="390" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="414" font-size="15" font-weight="700" fill="#4277BB">&lt; 25 ms</text>
<text x="1210" y="433" font-size="11.5" fill="#66727E">generate / verify a transaction</text>
<rect x="1180" y="450" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="474" font-size="15" font-weight="700" fill="#4277BB">66 B</text>
<text x="1210" y="493" font-size="11.5" fill="#66727E">on-chain state per account</text>
<rect x="1180" y="510" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="534" font-size="15" font-weight="700" fill="#4277BB">28 B</text>
<text x="1210" y="553" font-size="11.5" fill="#66727E">max data payload per transaction</text>
<rect x="1180" y="570" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="594" font-size="15" font-weight="700" fill="#4277BB">48 → 16</text>
<text x="1210" y="613" font-size="11.5" fill="#66727E">erasure chunks → needed to rebuild</text>
<rect x="1180" y="630" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="654" font-size="15" font-weight="700" fill="#4277BB">≈20.89 M</text>
<text x="1210" y="673" font-size="11.5" fill="#66727E">hard cap · halving every 4 years</text>
<rect x="1180" y="690" width="660" height="52" rx="8" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="1210" y="714" font-size="15" font-weight="700" fill="#4277BB">CPU-only</text>
<text x="1210" y="733" font-size="11.5" fill="#66727E">AstroBWTv3 — ASIC/GPU resistant</text>
<text x="960.0" y="900" text-anchor="middle" font-size="11" fill="#5A6B7A">DHEBP = DERO Homomorphic Encryption Blockchain Protocol · codename Stargate · Diagram v1 — collaborative repo: github.com/liqdmetal/DERO.STARGATE.DIAGRAMS</text>
<rect x="18" y="906" width="380" height="34" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2"/><text x="208" y="928" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">⚠️ DRAFT — community draft: not verified, reviewed, or audited</text></svg>