<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1800" height="1020" fill="#0B1220"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker></defs>
<rect x="18.0" y="974.0" width="400.0" height="34.0" rx="10" fill="#2A1216" stroke="#F87171" stroke-width="1.5"/>
<text x="30.0" y="996.0" font-size="12.5" font-weight="700" fill="#F87171">⚠️ DRAFT — community draft — not verified, reviewed, or audited</text>
<rect x="40.0" y="24.0" width="1720.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="46.0" font-size="12.5" font-weight="700" fill="#26334D">SELF-CUSTODY SECURITY POSTER</text>
<rect x="40.0" y="66.0" width="1720.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="88.0" font-size="12.5" font-weight="700" fill="#26334D">DERO has NO recovery service — if you lose the seed or wallet password, the coins are gone forever.  This page is the difference between safe and sorry.</text>
<rect x="120.0" y="130.0" width="220.0" height="46.0" rx="10" fill="#34D399" stroke="none" stroke-width="1.4"/>
<text x="132.0" y="152.0" font-size="12.5" font-weight="700" fill="none">DO</text>
<rect x="120.0" y="190.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="212.0" font-size="12.5" font-weight="700" fill="#34D399">Write the seed on paper, offline</text>
<rect x="136.0" y="224.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="246.0" font-size="12.5" font-weight="700" fill="#26334D">never on a connected device</text>
<rect x="120.0" y="290.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="312.0" font-size="12.5" font-weight="700" fill="#34D399">Store 2-3 copies in separate places</text>
<rect x="136.0" y="324.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="346.0" font-size="12.5" font-weight="700" fill="#26334D">fire/flood/theft safe</text>
<rect x="120.0" y="390.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="412.0" font-size="12.5" font-weight="700" fill="#34D399">Test restoring from the seed once</text>
<rect x="136.0" y="424.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="446.0" font-size="12.5" font-weight="700" fill="#26334D">before putting real funds in</text>
<rect x="120.0" y="490.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="512.0" font-size="12.5" font-weight="700" fill="#34D399">Use a strong wallet password</text>
<rect x="136.0" y="524.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="546.0" font-size="12.5" font-weight="700" fill="#26334D">that you also can’t forget</text>
<rect x="120.0" y="590.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="612.0" font-size="12.5" font-weight="700" fill="#34D399">Keep node + wallet on up-to-date releases</text>
<rect x="136.0" y="624.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="646.0" font-size="12.5" font-weight="700" fill="#26334D">and verify checksums / GPG</text>
<rect x="940.0" y="130.0" width="220.0" height="46.0" rx="10" fill="#F87171" stroke="none" stroke-width="1.4"/>
<text x="952.0" y="152.0" font-size="12.5" font-weight="700" fill="none">DON’T</text>
<rect x="940.0" y="190.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.4"/>
<text x="952.0" y="212.0" font-size="12.5" font-weight="700" fill="#F87171">Never type your seed into a website</text>
<rect x="956.0" y="224.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="246.0" font-size="12.5" font-weight="700" fill="#26334D">including “verification” sites</text>
<rect x="940.0" y="290.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.4"/>
<text x="952.0" y="312.0" font-size="12.5" font-weight="700" fill="#F87171">Never screenshot or cloud-store it</text>
<rect x="956.0" y="324.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="346.0" font-size="12.5" font-weight="700" fill="#26334D">photos sync = exposure</text>
<rect x="940.0" y="390.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.4"/>
<text x="952.0" y="412.0" font-size="12.5" font-weight="700" fill="#F87171">Never share it — support never asks</text>
<rect x="956.0" y="424.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="446.0" font-size="12.5" font-weight="700" fill="#26334D">support has no seed access</text>
<rect x="940.0" y="490.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.4"/>
<text x="952.0" y="512.0" font-size="12.5" font-weight="700" fill="#F87171">Don’t put big funds on a hot wallet</text>
<rect x="956.0" y="524.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="546.0" font-size="12.5" font-weight="700" fill="#26334D">use cold/offline storage</text>
<rect x="940.0" y="590.0" width="740.0" height="66.0" rx="10" fill="#141E36" stroke="#F87171" stroke-width="1.4"/>
<text x="952.0" y="612.0" font-size="12.5" font-weight="700" fill="#F87171">Don’t trust third-party “custody”</text>
<rect x="956.0" y="624.0" width="700.0" height="30.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="646.0" font-size="12.5" font-weight="700" fill="#26334D">only you should hold keys</text>
<rect x="120.0" y="720.0" width="300.0" height="20.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="132.0" y="742.0" font-size="12.5" font-weight="700" fill="#26334D">The threat model in one line</text>
<rect x="120.0" y="748.0" width="360.0" height="56.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.3"/>
<text x="132.0" y="770.0" font-size="12.5" font-weight="700" fill="#FBBF24">Phishing</text>
<rect x="120.0" y="808.0" width="360.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="132.0" y="830.0" font-size="12.5" font-weight="700" fill="#26334D">fake wallet sites &amp; “support” asking for seed</text>
<rect x="520.0" y="748.0" width="360.0" height="56.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.3"/>
<text x="532.0" y="770.0" font-size="12.5" font-weight="700" fill="#FBBF24">Malware / keyloggers</text>
<rect x="520.0" y="808.0" width="360.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="532.0" y="830.0" font-size="12.5" font-weight="700" fill="#26334D">keep your OS clean, verify downloads</text>
<rect x="920.0" y="748.0" width="360.0" height="56.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.3"/>
<text x="932.0" y="770.0" font-size="12.5" font-weight="700" fill="#FBBF24">Seed loss</text>
<rect x="920.0" y="808.0" width="360.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="932.0" y="830.0" font-size="12.5" font-weight="700" fill="#26334D">paper, metal, multiple copies — no recovery</text>
<rect x="1320.0" y="748.0" width="360.0" height="56.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.3"/>
<text x="1332.0" y="770.0" font-size="12.5" font-weight="700" fill="#FBBF24">Custodian failure</text>
<rect x="1320.0" y="808.0" width="360.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="1332.0" y="830.0" font-size="12.5" font-weight="700" fill="#26334D">exchange hacks — self-custody avoids this</text>
</svg>