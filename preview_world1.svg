<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="arg2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D32"/></marker></defs>
<rect x="0" y="0" width="1920" height="1400" fill="#FFFFFF"/>
<text x="960.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#4277BB">DERO’S PLACE IN THE MODERN WORLD</text>
<text x="960.0" y="82" text-anchor="middle" font-size="14" fill="#5A6B7A">Same everyday needs. Completely different plumbing. — How the DHEBP stack replaces banks, clouds and middlemen.</text>
<rect x="1600" y="60" width="290" height="30" rx="8" fill="#EAF2FB" stroke="#4277BB"/>
<text x="1745" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#4277BB">DERO · DHEBP (Stargate) · Layer 1 → 2</text>
<rect x="60" y="100" width="20" height="12" rx="3" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<text x="86" y="110" font-size="11" fill="#22303C">what you need</text>
<rect x="240" y="100" width="20" height="12" rx="3" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<text x="266" y="110" font-size="11" fill="#22303C">old world — centralized</text>
<rect x="480" y="100" width="20" height="12" rx="3" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="506" y="110" font-size="11" fill="#22303C">DERO world — decentralized &amp; private</text>
<text x="790" y="110" font-size="11" font-weight="700" fill="#2E7D32">→ replaced by</text>
<rect x="30" y="132" width="330" height="176" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<circle cx="50" cy="154" r="13" fill="#F9A825" stroke="#FFFFFF" stroke-width="2"/>
<text x="50" y="159" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
<text x="70" y="159" font-size="12" font-weight="700" fill="#F9A825">PAYING SOMEONE</text>
<text x="42" y="184" font-size="11" fill="#22303C">Send money to anyone, anywhere</text>
<rect x="390" y="132" width="560" height="176" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<text x="402" y="158" font-size="12.5" font-weight="700" fill="#C62828">Bank or payment app</text>
<text x="402" y="178" font-size="11" fill="#22303C">They see every payment, can freeze or censor you, charge fees, demand ID.</text>
<text x="402" y="200" font-size="10.5" font-style="italic" fill="#66727E">💡 The bank is the referee — and it keeps the ball.</text>
<rect x="980" y="132" width="630" height="176" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="992" y="158" font-size="12.5" font-weight="700" fill="#2E7D32">Direct private transfer (DHEBP)</text>
<text x="992" y="178" font-size="11" fill="#22303C">Amount + identity hidden by homomorphic encryption. Settled in ~1 min, tiny ~2.5 KB tx, tiny fee.</text>
<text x="992" y="200" font-size="10.5" font-style="italic" fill="#66727E">💡 Only you and the recipient know what moved.</text>
<line x1="950" y1="220.0" x2="980" y2="220.0" stroke="#2E7D32" stroke-width="3" marker-end="url(#arg2)"/>
<text x="965.0" y="212.0" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">replaced by</text>
<rect x="30" y="316" width="330" height="176" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<circle cx="50" cy="338" r="13" fill="#F9A825" stroke="#FFFFFF" stroke-width="2"/>
<text x="50" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
<text x="70" y="343" font-size="12" font-weight="700" fill="#F9A825">MAKING A DEAL</text>
<text x="42" y="368" font-size="11" fill="#22303C">Agree on terms both sides will honor</text>
<rect x="390" y="316" width="560" height="176" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<text x="402" y="342" font-size="12.5" font-weight="700" fill="#C62828">Lawyer, notary or platform</text>
<text x="402" y="362" font-size="11" fill="#22303C">Holds the money and the trust: slow, costly, and you must trust them.</text>
<text x="402" y="384" font-size="10.5" font-style="italic" fill="#66727E">💡 Trust is rented from a third party.</text>
<rect x="980" y="316" width="630" height="176" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="992" y="342" font-size="12.5" font-weight="700" fill="#2E7D32">DVM smart contract (DeroScript)</text>
<text x="992" y="362" font-size="11" fill="#22303C">Code is the escrow: it runs on every node, nobody can break or rewrite it. Escrow, tokens, auctions,</text>
<text x="992" y="378" font-size="11" fill="#22303C">lotteries.</text>
<text x="992" y="400" font-size="10.5" font-style="italic" fill="#66727E">💡 Trust is replaced by math everyone can check.</text>
<line x1="950" y1="404.0" x2="980" y2="404.0" stroke="#2E7D32" stroke-width="3" marker-end="url(#arg2)"/>
<text x="965.0" y="396.0" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">replaced by</text>
<rect x="30" y="500" width="330" height="176" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<circle cx="50" cy="522" r="13" fill="#F9A825" stroke="#FFFFFF" stroke-width="2"/>
<text x="50" y="527" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
<text x="70" y="527" font-size="12" font-weight="700" fill="#F9A825">STORING RECORDS</text>
<text x="42" y="552" font-size="11" fill="#22303C">Keep data safe, private, permanent</text>
<rect x="390" y="500" width="560" height="176" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<text x="402" y="526" font-size="12.5" font-weight="700" fill="#C62828">Company cloud (AWS, Google…)</text>
<text x="402" y="546" font-size="11" fill="#22303C">They read, sell, or lose your data; one breach exposes everything.</text>
<text x="402" y="568" font-size="10.5" font-style="italic" fill="#66727E">💡 Your data in someone else’s filing cabinet.</text>
<rect x="980" y="500" width="630" height="176" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="992" y="526" font-size="12.5" font-weight="700" fill="#2E7D32">Encrypted ledger + GravitonDB</text>
<text x="992" y="546" font-size="11" fill="#22303C">Accounts are 66 bytes of encrypted state, never decrypted, merkle-proved, prunable to a few GB.</text>
<text x="992" y="568" font-size="10.5" font-style="italic" fill="#66727E">💡 A lockbox only you can open.</text>
<line x1="950" y1="588.0" x2="980" y2="588.0" stroke="#2E7D32" stroke-width="3" marker-end="url(#arg2)"/>
<text x="965.0" y="580.0" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">replaced by</text>
<rect x="30" y="684" width="330" height="176" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<circle cx="50" cy="706" r="13" fill="#F9A825" stroke="#FFFFFF" stroke-width="2"/>
<text x="50" y="711" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
<text x="70" y="711" font-size="12" font-weight="700" fill="#F9A825">RUNNING AN APP</text>
<text x="42" y="736" font-size="11" fill="#22303C">Host software people can use</text>
<rect x="390" y="684" width="560" height="176" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<text x="402" y="710" font-size="12.5" font-weight="700" fill="#C62828">Web server + domain + hosting</text>
<text x="402" y="730" font-size="11" fill="#22303C">One point of failure: can be blocked, hacked, or switched off.</text>
<text x="402" y="752" font-size="10.5" font-style="italic" fill="#66727E">💡 Your shop sits on someone else’s land.</text>
<rect x="980" y="684" width="630" height="176" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="992" y="710" font-size="12.5" font-weight="700" fill="#2E7D32">TELA — apps on the chain</text>
<text x="992" y="730" font-size="11" fill="#22303C">Code and assets live on-chain, served by the network itself. No origin server to attack or censor.</text>
<text x="992" y="752" font-size="10.5" font-style="italic" fill="#66727E">💡 Your shop is on everyone’s land — and nobody owns it.</text>
<line x1="950" y1="772.0" x2="980" y2="772.0" stroke="#2E7D32" stroke-width="3" marker-end="url(#arg2)"/>
<text x="965.0" y="764.0" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">replaced by</text>
<rect x="30" y="868" width="330" height="176" rx="10" fill="#FFF8E1" stroke="#F9A825" stroke-width="2"/>
<circle cx="50" cy="890" r="13" fill="#F9A825" stroke="#FFFFFF" stroke-width="2"/>
<text x="50" y="895" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">5</text>
<text x="70" y="895" font-size="12" font-weight="700" fill="#F9A825">PROVING WHO YOU ARE</text>
<text x="42" y="920" font-size="11" fill="#22303C">Authenticate without being spied on</text>
<rect x="390" y="868" width="560" height="176" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2"/>
<text x="402" y="894" font-size="12.5" font-weight="700" fill="#C62828">Passwords + emails + data brokers</text>
<text x="402" y="914" font-size="11" fill="#22303C">Leaks, phishing, and your identity bought and sold.</text>
<text x="402" y="936" font-size="10.5" font-style="italic" fill="#66727E">💡 You flash your whole wallet to prove you’re an adult.</text>
<rect x="980" y="868" width="630" height="176" rx="10" fill="#E8F5E9" stroke="#2E7D32" stroke-width="2"/>
<text x="992" y="894" font-size="12.5" font-weight="700" fill="#2E7D32">Wallet + DeroAuth + usernames</text>
<text x="992" y="914" font-size="11" fill="#22303C">Sign in with your wallet (XSWD bridge); the DVM Name Service gives human names; zero-knowledge</text>
<text x="992" y="930" font-size="11" fill="#22303C">proofs reveal only what’s needed.</text>
<text x="992" y="952" font-size="10.5" font-style="italic" fill="#66727E">💡 Prove you’re over 18 without showing your ID.</text>
<line x1="950" y1="956.0" x2="980" y2="956.0" stroke="#2E7D32" stroke-width="3" marker-end="url(#arg2)"/>
<text x="965.0" y="948.0" text-anchor="middle" font-size="11" font-weight="700" fill="#2E7D32" stroke="#FFFFFF" stroke-width="3" paint-order="stroke">replaced by</text>
<text x="1646" y="158" font-size="14" font-weight="700" fill="#00838F">THE DERO TOOLBOX</text>
<rect x="1640" y="172" width="250" height="62" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5"/>
<text x="1765.0" y="196" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">DHEBP · Layer 1</text>
<text x="1765.0" y="214" text-anchor="middle" font-size="9.5" fill="#66727E">encrypted chain · PoW AstroBWTv3 · 18 s blocks</text>
<rect x="1640" y="242" width="250" height="62" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5"/>
<text x="1765.0" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">DVM</text>
<text x="1765.0" y="284" text-anchor="middle" font-size="9.5" fill="#66727E">smart contracts · DeroScript</text>
<rect x="1640" y="312" width="250" height="62" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5"/>
<text x="1765.0" y="336" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">GravitonDB</text>
<text x="1765.0" y="354" text-anchor="middle" font-size="9.5" fill="#66727E">encrypted key/value state</text>
<rect x="1640" y="382" width="250" height="62" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5"/>
<text x="1765.0" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">TELA</text>
<text x="1765.0" y="424" text-anchor="middle" font-size="9.5" fill="#66727E">on-chain apps &amp; web — no server</text>
<rect x="1640" y="452" width="250" height="62" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5"/>
<text x="1765.0" y="476" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">XSWD</text>
<text x="1765.0" y="494" text-anchor="middle" font-size="9.5" fill="#66727E">app ↔ wallet bridge</text>
<rect x="1640" y="522" width="250" height="62" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5"/>
<text x="1765.0" y="546" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">DeroAuth / DeroPay</text>
<text x="1765.0" y="564" text-anchor="middle" font-size="9.5" fill="#66727E">sign in · pay with your wallet</text>
<rect x="1640" y="592" width="250" height="62" rx="8" fill="#E0F7FA" stroke="#00838F" stroke-width="1.5"/>
<text x="1765.0" y="616" text-anchor="middle" font-size="11" font-weight="700" fill="#00838F">Name Service</text>
<text x="1765.0" y="634" text-anchor="middle" font-size="9.5" fill="#66727E">human usernames on-chain</text>
<text x="40" y="1116" font-size="15" font-weight="700" fill="#4277BB">THE SAME JOB — NO MIDDLEMAN</text>
<rect x="40" y="1128" width="1810" height="96" rx="10" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="60" y="1162" font-size="13.5" fill="#22303C">Money, deals, data, apps, identity — the modern world runs them on banks, clouds and platforms. DERO runs them on one shared, private,</text>
<text x="60" y="1184" font-size="13.5" fill="#22303C">tamper-proof network: every node does the job, and none of them can see your business.</text>
<rect x="18" y="1356" width="380" height="34" rx="8" fill="#FDECEA" stroke="#C62828" stroke-width="2"/><text x="208" y="1378" text-anchor="middle" font-size="11" font-weight="700" fill="#C62828">⚠️ DRAFT — community draft: not verified, reviewed, or audited</text></svg>