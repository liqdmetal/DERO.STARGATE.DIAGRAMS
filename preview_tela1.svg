<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="atb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0076BE"/></marker></defs>
<rect x="0" y="0" width="1920" height="1400" fill="#FFFFFF"/>
<text x="960.0" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#4277BB">FROM IDEA TO ON-CHAIN APP</text>
<text x="960.0" y="82" text-anchor="middle" font-size="14" fill="#5A6B7A">Build a dApp on DERO: DVM smart contract + TELA front-end + XSWD wallet bridge — no server, no middleman, full privacy.</text>
<rect x="60" y="150" width="540" height="380" rx="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2"/>
<circle cx="60" cy="150" r="17" fill="#1E88E5" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="60" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
<text x="72" y="184" font-size="12.5" font-weight="700" fill="#1E88E5">WRITE THE CODE</text>
<text x="72" y="205" font-size="11" fill="#22303C">Smart contract in DVM-BASIC (DeroScript) + the app front-end (HTML/CSS/JS). dSlate</text>
<text x="72" y="221" font-size="11" fill="#22303C">gives a visual editor; the VSCode extension adds syntax highlighting.</text>
<text x="72" y="243" font-size="10.5" font-style="italic" fill="#66727E">💡 You write normal-looking code — the backend is the whole network.</text>
<rect x="700" y="150" width="540" height="380" rx="10" fill="#FFFFFF" stroke="#00838F" stroke-width="2"/>
<circle cx="700" cy="150" r="17" fill="#00838F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="700" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
<text x="712" y="184" font-size="12.5" font-weight="700" fill="#00838F">DEPLOY (install_sc)</text>
<text x="712" y="205" font-size="11" fill="#22303C">Send the code to the chain via RPC (install_sc) and get back an SCID. The contract</text>
<text x="712" y="221" font-size="11" fill="#22303C">now runs on every node. One-time fee — no hosting bill.</text>
<text x="712" y="243" font-size="10.5" font-style="italic" fill="#66727E">💡 Your program moves into a building everyone owns and nobody controls.</text>
<rect x="1340" y="150" width="540" height="380" rx="10" fill="#FFFFFF" stroke="#8E24AA" stroke-width="2"/>
<circle cx="1340" cy="150" r="17" fill="#8E24AA" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1340" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
<text x="1352" y="184" font-size="12.5" font-weight="700" fill="#8E24AA">CONNECT THE WALLET (XSWD)</text>
<text x="1352" y="205" font-size="11" fill="#22303C">The app talks to the user’s wallet over a WebSocket bridge. The user grants</text>
<text x="1352" y="221" font-size="11" fill="#22303C">per-request permissions: ask / accept_always / deny_always.</text>
<text x="1352" y="243" font-size="10.5" font-style="italic" fill="#66727E">💡 The app can’t touch your money unless you approve — per request.</text>
<rect x="60" y="640" width="540" height="380" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2"/>
<circle cx="60" cy="640" r="17" fill="#2E7D32" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="60" y="645" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
<text x="72" y="674" font-size="12.5" font-weight="700" fill="#2E7D32">USERS SIGN IN &amp; PAY (DeroAuth / DeroPay)</text>
<text x="72" y="695" font-size="11" fill="#22303C">Users log in with their wallet — no passwords — and pay in DERO, all inside the</text>
<text x="72" y="711" font-size="11" fill="#22303C">wallet (Engram). Payments and identity stay private.</text>
<text x="72" y="733" font-size="10.5" font-style="italic" fill="#66727E">💡 Signing in = approving with your wallet.</text>
<rect x="700" y="640" width="540" height="380" rx="10" fill="#FFFFFF" stroke="#00838F" stroke-width="2"/>
<circle cx="700" cy="640" r="17" fill="#00838F" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="700" y="645" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
<text x="712" y="674" font-size="12.5" font-weight="700" fill="#00838F">TELA SERVES IT</text>
<text x="712" y="695" font-size="11" fill="#22303C">App code and assets are stored on-chain and rendered locally in Engram (wallet +</text>
<text x="712" y="711" font-size="11" fill="#22303C">browser). No origin server to hack, block, or censor.</text>
<text x="712" y="733" font-size="10.5" font-style="italic" fill="#66727E">💡 Your shop is on everyone’s land — and nobody owns it.</text>
<rect x="1340" y="640" width="540" height="380" rx="10" fill="#FFFFFF" stroke="#FB8C00" stroke-width="2"/>
<circle cx="1340" cy="640" r="17" fill="#FB8C00" stroke="#FFFFFF" stroke-width="2.5"/>
<text x="1340" y="645" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
<text x="1352" y="674" font-size="12.5" font-weight="700" fill="#FB8C00">ITERATE &amp; GROW</text>
<text x="1352" y="695" font-size="11" fill="#22303C">New versions are registered on-chain; state stays encrypted (private DVM state);</text>
<text x="1352" y="711" font-size="11" fill="#22303C">Gnomon indexes chain data for analytics.</text>
<text x="1352" y="733" font-size="10.5" font-style="italic" fill="#66727E">💡 Software that can’t be yanked away — upgradeable, private, unstoppable.</text>
<line x1="600" y1="340" x2="700" y2="340" stroke="#0076BE" stroke-width="2.5" marker-end="url(#atb)"/>
<line x1="1240" y1="340" x2="1340" y2="340" stroke="#0076BE" stroke-width="2.5" marker-end="url(#atb)"/>
<path d="M 1610 530 L 1610 640" stroke="#0076BE" stroke-width="2.5" marker-end="url(#atb)"/>
<text x="1622" y="590" font-size="10.5" font-weight="600" fill="#0076BE" stroke="#FFF" stroke-width="3" paint-order="stroke">deployed &amp; live</text>
<path d="M 330 700 L 330 640" stroke="#0076BE" stroke-width="2.5" marker-end="url(#atb)"/>
<path d="M 970 700 L 970 640" stroke="#0076BE" stroke-width="2.5" marker-end="url(#atb)"/>
<path d="M 1610 1020 L 1610 1090" stroke="#0076BE" stroke-width="2.5" marker-end="url(#atb)"/>
<text x="1622" y="1060" font-size="10.5" font-weight="600" fill="#0076BE" stroke="#FFF" stroke-width="3" paint-order="stroke">users in the wallet</text>
<text x="40" y="1126" font-size="15" font-weight="700" fill="#4277BB">THE RESULT</text>
<rect x="40" y="1138" width="1830" height="96" rx="10" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="60" y="1172" font-size="13.5" fill="#22303C">A web app that cannot be taken down, whose users log in with their wallet, whose data is encrypted — hosted by the network</text>
<text x="60" y="1194" font-size="13.5" fill="#22303C">itself. That is TELA.</text>
</svg>