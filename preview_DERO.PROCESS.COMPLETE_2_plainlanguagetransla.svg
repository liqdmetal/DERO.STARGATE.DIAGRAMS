<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="950" viewBox="0 0 1920 950" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1920" height="950" fill="#0B1220"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker></defs>
<rect x="18.0" y="904.0" width="400.0" height="34.0" rx="10" fill="#2A1216" stroke="#F87171" stroke-width="1.5"/>
<text x="30.0" y="926.0" font-size="12.5" font-weight="700" fill="#F87171">⚠️ DRAFT — community draft — not verified, reviewed, or audited</text>
<rect x="20.0" y="22.0" width="1880.0" height="40.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="44.0" font-size="12.5" font-weight="700" fill="#26334D">THE SAME JOURNEY IN PLAIN WORDS</text>
<rect x="20.0" y="66.0" width="1880.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="88.0" font-size="12.5" font-weight="700" fill="#26334D">Print or share this page with a non-technical audience — the companion to the ‘Journey of One Transaction’ diagram.</text>
<rect x="60.0" y="115.0" width="500.0" height="26.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="72.0" y="137.0" font-size="12.5" font-weight="700" fill="#26334D">TECH SPEAK → PLAIN SPEAK</text>
<rect x="1180.0" y="115.0" width="500.0" height="26.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="1192.0" y="137.0" font-size="12.5" font-weight="700" fill="#26334D">KEY NUMBERS</text>
<rect x="60.0" y="150.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="172.0" font-size="12.5" font-weight="700" fill="#26334D">Homomorphic encryption</text>
<text x="72.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Math you can add and subtract while it’s still locked in a safe — balances stay secret.</text>
<rect x="60.0" y="210.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="232.0" font-size="12.5" font-weight="700" fill="#26334D">Ring signatures (ring of 8)</text>
<text x="72.0" y="247.0" font-size="10.5" font-weight="400" fill="#5A6B7A">You stand in a crowd of 8 people. Nobody can tell which one is you.</text>
<rect x="60.0" y="270.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="292.0" font-size="12.5" font-weight="700" fill="#26334D">Zero-knowledge proofs (Bulletproofs)</text>
<text x="72.0" y="307.0" font-size="10.5" font-weight="400" fill="#5A6B7A">‘Trust me, the math is right’ — proven without revealing any secret.</text>
<rect x="60.0" y="330.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="352.0" font-size="12.5" font-weight="700" fill="#26334D">Mempool</text>
<text x="72.0" y="367.0" font-size="10.5" font-weight="400" fill="#5A6B7A">The waiting room for payments that haven’t been written into the ledger yet.</text>
<rect x="60.0" y="390.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="412.0" font-size="12.5" font-weight="700" fill="#26334D">AstroBWTv3 proof-of-work</text>
<text x="72.0" y="427.0" font-size="10.5" font-weight="400" fill="#5A6B7A">A CPU puzzle lottery that keeps the network honest — any PC can play.</text>
<rect x="60.0" y="450.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="472.0" font-size="12.5" font-weight="700" fill="#26334D">Mini-blocks (10 per block)</text>
<text x="72.0" y="487.0" font-size="10.5" font-weight="400" fill="#5A6B7A">One notebook page has 10 lines — up to 10 miners get paid per page.</text>
<rect x="60.0" y="510.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="532.0" font-size="12.5" font-weight="700" fill="#26334D">Erasure-coded blocks (48 → 16)</text>
<text x="72.0" y="547.0" font-size="10.5" font-weight="400" fill="#5A6B7A">The page is torn into 48 pieces of confetti; any 16 rebuild it. Faster and tougher.</text>
<rect x="60.0" y="570.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="592.0" font-size="12.5" font-weight="700" fill="#26334D">DVM + DeroScript</text>
<text x="72.0" y="607.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Programs (smart contracts) that run on every node and update the encrypted notebook together.</text>
<rect x="60.0" y="630.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="652.0" font-size="12.5" font-weight="700" fill="#26334D">66 bytes per account</text>
<text x="72.0" y="667.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Your whole account state is smaller than this sentence.</text>
<rect x="60.0" y="690.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="712.0" font-size="12.5" font-weight="700" fill="#26334D">TLS-encrypted P2P network</text>
<text x="72.0" y="727.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Nodes talk to each other over a secure, wiretap-proof line.</text>
<rect x="60.0" y="750.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="772.0" font-size="12.5" font-weight="700" fill="#26334D">28-byte data payload</text>
<text x="72.0" y="787.0" font-size="10.5" font-weight="400" fill="#5A6B7A">A tiny note glued to a payment — a message that travels with it.</text>
<rect x="60.0" y="810.0" width="1080.0" height="52.0" rx="10" fill="#141E36" stroke="#26334D" stroke-width="1.5"/>
<text x="72.0" y="832.0" font-size="12.5" font-weight="700" fill="#26334D">18 s blocks / ~1 min confirmation</text>
<text x="72.0" y="847.0" font-size="10.5" font-weight="400" fill="#5A6B7A">A new page every 18 seconds; your payment is officially settled in about a minute.</text>
<rect x="1180.0" y="150.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="172.0" font-size="12.5" font-weight="700" fill="#">18 s</text>
<text x="1192.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">average block time</text>
<rect x="1180.0" y="210.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="232.0" font-size="12.5" font-weight="700" fill="#">10 (9+1)</text>
<text x="1192.0" y="247.0" font-size="10.5" font-weight="400" fill="#5A6B7A">mini-blocks per block (≈1 every 2 s)</text>
<rect x="1180.0" y="270.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="292.0" font-size="12.5" font-weight="700" fill="#">8</text>
<text x="1192.0" y="307.0" font-size="10.5" font-weight="400" fill="#5A6B7A">default ring size (anonymity set)</text>
<rect x="1180.0" y="330.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="352.0" font-size="12.5" font-weight="700" fill="#">~2.5 KB</text>
<text x="1192.0" y="367.0" font-size="10.5" font-weight="400" fill="#5A6B7A">transaction size (ring 8)</text>
<rect x="1180.0" y="390.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="412.0" font-size="12.5" font-weight="700" fill="#">&lt; 25 ms</text>
<text x="1192.0" y="427.0" font-size="10.5" font-weight="400" fill="#5A6B7A">generate / verify a transaction</text>
<rect x="1180.0" y="450.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="472.0" font-size="12.5" font-weight="700" fill="#">66 B</text>
<text x="1192.0" y="487.0" font-size="10.5" font-weight="400" fill="#5A6B7A">on-chain state per account</text>
<rect x="1180.0" y="510.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="532.0" font-size="12.5" font-weight="700" fill="#">28 B</text>
<text x="1192.0" y="547.0" font-size="10.5" font-weight="400" fill="#5A6B7A">max data payload per transaction</text>
<rect x="1180.0" y="570.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="592.0" font-size="12.5" font-weight="700" fill="#">48 → 16</text>
<text x="1192.0" y="607.0" font-size="10.5" font-weight="400" fill="#5A6B7A">erasure chunks → needed to rebuild</text>
<rect x="1180.0" y="630.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="652.0" font-size="12.5" font-weight="700" fill="#">≈20.89 M</text>
<text x="1192.0" y="667.0" font-size="10.5" font-weight="400" fill="#5A6B7A">hard cap · halving every 4 years</text>
<rect x="1180.0" y="690.0" width="660.0" height="52.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="1192.0" y="712.0" font-size="12.5" font-weight="700" fill="#">CPU-only</text>
<text x="1192.0" y="727.0" font-size="10.5" font-weight="400" fill="#5A6B7A">AstroBWTv3 — ASIC/GPU resistant</text>
<rect x="20.0" y="900.0" width="1880.0" height="20.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="922.0" font-size="12.5" font-weight="700" fill="#26334D">DHEBP = DERO Homomorphic Encryption Blockchain Protocol · codename Stargate · collaborative repo: github.com/liqdmetal/DERO.STARGATE.DIAGRAMS</text>
</svg>