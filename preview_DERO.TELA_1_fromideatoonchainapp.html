<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" font-family="Segoe UI, Arial, sans-serif">

<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker></defs>
<rect x="18.0" y="1356.0" width="380.0" height="34.0" rx="10" fill="#FDECEA" stroke="#C62828" stroke-width="2.0"/>
<text x="30.0" y="1378.0" font-size="12.5" font-weight="700" fill="#C62828">⚠️ DRAFT — community draft — not verified, reviewed, or audited</text>
<rect x="20.0" y="22.0" width="1880.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="44.0" font-size="12.5" font-weight="700" fill="#26334D">FROM IDEA TO ON-CHAIN APP</text>
<rect x="20.0" y="66.0" width="1880.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="32.0" y="88.0" font-size="12.5" font-weight="700" fill="#26334D">Build a dApp on DERO: DVM smart contract + TELA front-end + XSWD wallet bridge — no server, no middleman, full privacy.  · read 1 → 6</text>
<rect x="60.0" y="150.0" width="540.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#1E88E5" stroke-width="2.0"/>
<text x="72.0" y="172.0" font-size="12.5" font-weight="700" fill="#1E88E5">1 · WRITE THE CODE</text>
<text x="72.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Smart contract in DVM-BASIC (DeroScript) + the app front-end (HTML/CSS/JS). dSlate</text>
<text x="72.0" y="202.0" font-size="10.5" font-weight="400" fill="#5A6B7A">gives a visual editor; the VSCode extension adds syntax highlighting.</text>
<text x="72.0" y="217.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="60.0" cy="150.0" rx="17.0" ry="17.0" fill="#1E88E5" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="55.0" y="155.0" font-size="12.5" font-weight="700" fill="#FFFFFF">1</text>
<rect x="700.0" y="150.0" width="540.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#00838F" stroke-width="2.0"/>
<text x="712.0" y="172.0" font-size="12.5" font-weight="700" fill="#00838F">2 · DEPLOY (install_sc)</text>
<text x="712.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Send the code to the chain via RPC (install_sc) and get back an SCID. The contract</text>
<text x="712.0" y="202.0" font-size="10.5" font-weight="400" fill="#5A6B7A">now runs on every node. One-time fee — no hosting bill.</text>
<text x="712.0" y="217.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="700.0" cy="150.0" rx="17.0" ry="17.0" fill="#00838F" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="695.0" y="155.0" font-size="12.5" font-weight="700" fill="#FFFFFF">2</text>
<rect x="1340.0" y="150.0" width="540.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#8E24AA" stroke-width="2.0"/>
<text x="1352.0" y="172.0" font-size="12.5" font-weight="700" fill="#8E24AA">3 · CONNECT THE WALLET (XSWD)</text>
<text x="1352.0" y="187.0" font-size="10.5" font-weight="400" fill="#5A6B7A">The app talks to the user’s wallet over a WebSocket bridge. The user grants</text>
<text x="1352.0" y="202.0" font-size="10.5" font-weight="400" fill="#5A6B7A">per-request permissions: ask / accept_always / deny_always.</text>
<text x="1352.0" y="217.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="1340.0" cy="150.0" rx="17.0" ry="17.0" fill="#8E24AA" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="1335.0" y="155.0" font-size="12.5" font-weight="700" fill="#FFFFFF">3</text>
<rect x="60.0" y="640.0" width="540.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#2E7D32" stroke-width="2.0"/>
<text x="72.0" y="662.0" font-size="12.5" font-weight="700" fill="#2E7D32">4 · USERS SIGN IN &amp; PAY (DeroAuth / DeroPay)</text>
<text x="72.0" y="677.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Users log in with their wallet — no passwords — and pay in DERO, all inside the</text>
<text x="72.0" y="692.0" font-size="10.5" font-weight="400" fill="#5A6B7A">wallet (Engram). Payments and identity stay private.</text>
<text x="72.0" y="707.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="60.0" cy="640.0" rx="17.0" ry="17.0" fill="#2E7D32" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="55.0" y="645.0" font-size="12.5" font-weight="700" fill="#FFFFFF">4</text>
<rect x="700.0" y="640.0" width="540.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#00838F" stroke-width="2.0"/>
<text x="712.0" y="662.0" font-size="12.5" font-weight="700" fill="#00838F">5 · TELA SERVES IT</text>
<text x="712.0" y="677.0" font-size="10.5" font-weight="400" fill="#5A6B7A">App code and assets are stored on-chain and rendered locally in Engram (wallet +</text>
<text x="712.0" y="692.0" font-size="10.5" font-weight="400" fill="#5A6B7A">browser). No origin server to hack, block, or censor.</text>
<text x="712.0" y="707.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="700.0" cy="640.0" rx="17.0" ry="17.0" fill="#00838F" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="695.0" y="645.0" font-size="12.5" font-weight="700" fill="#FFFFFF">5</text>
<rect x="1340.0" y="640.0" width="540.0" height="380.0" rx="10" fill="#FFFFFF" stroke="#FB8C00" stroke-width="2.0"/>
<text x="1352.0" y="662.0" font-size="12.5" font-weight="700" fill="#FB8C00">6 · ITERATE &amp; GROW</text>
<text x="1352.0" y="677.0" font-size="10.5" font-weight="400" fill="#5A6B7A">New versions are registered on-chain; state stays encrypted (private DVM state);</text>
<text x="1352.0" y="692.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Gnomon indexes chain data for analytics.</text>
<text x="1352.0" y="707.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="1340.0" cy="640.0" rx="17.0" ry="17.0" fill="#FB8C00" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="1335.0" y="645.0" font-size="12.5" font-weight="700" fill="#FFFFFF">6</text>
<rect x="40.0" y="1105.0" width="260.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="1127.0" font-size="12.5" font-weight="700" fill="#26334D">THE RESULT</text>
<rect x="40.0" y="1130.0" width="1830.0" height="96.0" rx="10" fill="#F4F8FC" stroke="#4277BB" stroke-width="1.5"/>
<text x="52.0" y="1152.0" font-size="12.5" font-weight="700" fill="#4277BB">A web app that cannot be taken down, whose users log in with their wallet, whose data is encrypted — hosted by the network itself. That is TELA.</text>
