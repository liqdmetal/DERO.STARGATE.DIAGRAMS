<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1020" viewBox="0 0 1800 1020" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1800" height="1020" fill="#0B1220"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#38BDF8"/></marker></defs>
<rect x="18.0" y="974.0" width="400.0" height="34.0" rx="10" fill="#2A1216" stroke="#F87171" stroke-width="1.5"/>
<text x="30.0" y="996.0" font-size="12.5" font-weight="700" fill="#F87171">⚠️ DRAFT — community draft — not verified, reviewed, or audited</text>
<rect x="40.0" y="24.0" width="1720.0" height="42.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="46.0" font-size="12.5" font-weight="700" fill="#26334D">WHAT ‘PRIVATE’ ACTUALLY MEANS</text>
<rect x="40.0" y="66.0" width="1720.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="88.0" font-size="12.5" font-weight="700" fill="#26334D">Grounded in the code, not the marketing.  DERO hides amounts and identities strongly — but “private” is not “anonymous.”</text>
<rect x="120.0" y="130.0" width="360.0" height="44.0" rx="10" fill="#34D399" stroke="none" stroke-width="1.4"/>
<text x="132.0" y="152.0" font-size="12.5" font-weight="700" fill="none">HIDDEN — by the protocol</text>
<rect x="120.0" y="190.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="212.0" font-size="12.5" font-weight="700" fill="#34D399">Your balances</text>
<rect x="136.0" y="230.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="252.0" font-size="12.5" font-weight="700" fill="#26334D">homomorphically encrypted — 66 B/account, never decrypted on-chain</text>
<rect x="120.0" y="310.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="332.0" font-size="12.5" font-weight="700" fill="#34D399">Transaction amounts</text>
<rect x="136.0" y="350.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="372.0" font-size="12.5" font-weight="700" fill="#26334D">encrypted; provable without revealing the value</text>
<rect x="120.0" y="430.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="452.0" font-size="12.5" font-weight="700" fill="#34D399">Who sent to whom</text>
<rect x="136.0" y="470.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="492.0" font-size="12.5" font-weight="700" fill="#26334D">ring signatures (ring 8) mask the true sender/receiver link</text>
<rect x="120.0" y="550.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="1.4"/>
<text x="132.0" y="572.0" font-size="12.5" font-weight="700" fill="#34D399">Contract / dApp state</text>
<rect x="136.0" y="590.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="148.0" y="612.0" font-size="12.5" font-weight="700" fill="#26334D">DVM state is encrypted — only what you approve is visible</text>
<rect x="940.0" y="130.0" width="360.0" height="44.0" rx="10" fill="#FBBF24" stroke="none" stroke-width="1.4"/>
<text x="952.0" y="152.0" font-size="12.5" font-weight="700" fill="none">VISIBLE — metadata &amp; you</text>
<rect x="940.0" y="190.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.4"/>
<text x="952.0" y="212.0" font-size="12.5" font-weight="700" fill="#FBBF24">Transaction time &amp; size</text>
<rect x="956.0" y="230.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="252.0" font-size="12.5" font-weight="700" fill="#26334D">the chain stores when and how big — metadata is public</text>
<rect x="940.0" y="310.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.4"/>
<text x="952.0" y="332.0" font-size="12.5" font-weight="700" fill="#FBBF24">Node IP / network layer</text>
<rect x="956.0" y="350.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="372.0" font-size="12.5" font-weight="700" fill="#26334D">TLS protects content, but your node’s IP is visible to peers</text>
<rect x="940.0" y="430.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.4"/>
<text x="952.0" y="452.0" font-size="12.5" font-weight="700" fill="#FBBF24">Your node sees your txs</text>
<rect x="956.0" y="470.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="492.0" font-size="12.5" font-weight="700" fill="#26334D">if you run a node, it knows your wallet’s activity</text>
<rect x="940.0" y="550.0" width="740.0" height="80.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="1.4"/>
<text x="952.0" y="572.0" font-size="12.5" font-weight="700" fill="#FBBF24">What a dApp is approved to see</text>
<rect x="956.0" y="590.0" width="700.0" height="36.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="968.0" y="612.0" font-size="12.5" font-weight="700" fill="#26334D">XSWD exposes exactly the methods you accept — review them</text>
<rect x="120.0" y="700.0" width="1560.0" height="76.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="132.0" y="722.0" font-size="12.5" font-weight="700" fill="#">THE HONEST VERSION: DERO’s account model (encrypted balances, no key images, no UTXO decoys) is structurally less heuristic-attackable than Monero’s — but metadata analysis, node-level observation, and poor op-sec still leak.  “Private by default” ≠ “untraceable.”</text>
</svg>