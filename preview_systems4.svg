<text x="960" y="896" text-anchor="middle" font-size="12.5" fill="#5A6B7A">Active development lives at DEROFDN/derohe (community-dev). deroproject/derohe still hosts the released binaries (Release142). Both build the same consensus-compatible DERO.</text>
