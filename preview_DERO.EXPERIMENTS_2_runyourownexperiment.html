<text x="72.0" y="352.0" font-size="12.5" font-weight="700" fill="#2E7D32">STEP 3 · RUN THE SIMULATOR</text>
<text x="72.0" y="367.0" font-size="10.5" font-weight="400" fill="#5A6B7A">derod --simulator spins up a local chain with pre-funded wallets — no risk, no cost, instant feedback.</text>
