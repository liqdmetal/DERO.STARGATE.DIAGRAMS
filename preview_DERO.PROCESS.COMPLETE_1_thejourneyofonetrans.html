<text x="40.0" y="696.0" font-size="12.5" font-weight="700" fill="#26334D">every node worldwide</text>

<text x="40.0" y="1056.0" font-size="12.5" font-weight="700" fill="#26334D">the shared encrypted record (DLT)</text>
<rect x="250.0" y="144.0" width="520.0" height="105.0" rx="10" fill="#141E36" stroke="#FBBF24" stroke-width="2.0"/>
<text x="262.0" y="166.0" font-size="12.5" font-weight="700" fill="#FBBF24">1 · YOU want to send DERO (or use a dApp)</text>
<text x="262.0" y="181.0" font-size="10.5" font-weight="400" fill="#5A6B7A">You open your wallet — CLI, GUI, web or mobile — enter an amount, or open a</text>
<text x="262.0" y="196.0" font-size="10.5" font-weight="400" fill="#5A6B7A">decentralized app built on DERO.</text>
<text x="262.0" y="211.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="250.0" cy="144.0" rx="17.0" ry="17.0" fill="#FBBF24" stroke="#0B1220" stroke-width="2.0"/>
<text x="245.0" y="149.0" font-size="12.5" font-weight="700" fill="#0B1220">1</text>
<rect x="250.0" y="284.0" width="600.0" height="120.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="2.0"/>
<text x="262.0" y="306.0" font-size="12.5" font-weight="700" fill="#34D399">2 · WALLET builds a sealed envelope (≈25 ms)</text>
<text x="262.0" y="321.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Picks a ring of 8 accounts (yours + 7 decoys) · hides the amount with homomorphic encryption + a</text>
<text x="262.0" y="336.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Pedersen commitment · attaches six bound zero-knowledge proofs (ring, range, balance…) · optional</text>
<text x="262.0" y="351.0" font-size="10.5" font-weight="400" fill="#5A6B7A">28-byte message.</text>
<ellipse cx="250.0" cy="284.0" rx="17.0" ry="17.0" fill="#34D399" stroke="#0B1220" stroke-width="2.0"/>
<text x="245.0" y="289.0" font-size="12.5" font-weight="700" fill="#0B1220">2</text>
<rect x="880.0" y="284.0" width="380.0" height="134.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="2.0"/>
<text x="892.0" y="306.0" font-size="12.5" font-weight="700" fill="#34D399">3 · WALLET signs with your private key</text>
<text x="892.0" y="321.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Your key authorizes the tx on your device and never leaves</text>
<text x="892.0" y="336.0" font-size="10.5" font-weight="400" fill="#5A6B7A">it. Nobody can tell which of the 8 ring accounts is really</text>
<text x="892.0" y="351.0" font-size="10.5" font-weight="400" fill="#5A6B7A">yours.</text>
<ellipse cx="880.0" cy="284.0" rx="17.0" ry="17.0" fill="#34D399" stroke="#0B1220" stroke-width="2.0"/>
<text x="875.0" y="289.0" font-size="12.5" font-weight="700" fill="#0B1220">3</text>
<rect x="250.0" y="494.0" width="430.0" height="105.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="2.0"/>
<text x="262.0" y="516.0" font-size="12.5" font-weight="700" fill="#38BDF8">4 · YOUR NODE receives it (RPC)</text>
<text x="262.0" y="531.0" font-size="10.5" font-weight="400" fill="#5A6B7A">The wallet hands the tx to your daemon over local RPC. Quick checks:</text>
<text x="262.0" y="546.0" font-size="10.5" font-weight="400" fill="#5A6B7A">format, fee, proofs.</text>
<text x="262.0" y="561.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="250.0" cy="494.0" rx="17.0" ry="17.0" fill="#38BDF8" stroke="#0B1220" stroke-width="2.0"/>
<text x="245.0" y="499.0" font-size="12.5" font-weight="700" fill="#0B1220">4</text>
<rect x="700.0" y="494.0" width="430.0" height="90.0" rx="10" fill="#141E36" stroke="#38BDF8" stroke-width="2.0"/>
<text x="712.0" y="516.0" font-size="12.5" font-weight="700" fill="#38BDF8">5 · YOUR NODE adds it to the mempool</text>
<text x="712.0" y="531.0" font-size="10.5" font-weight="400" fill="#5A6B7A">The pool of unconfirmed transactions, shared with every peer.</text>
<text x="712.0" y="546.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<text x="712.0" y="561.0" font-size="10.5" font-weight="400" fill="#5A6B7A">💡 The waiting room. Your tx waits for a miner to pick it up.</text>
<ellipse cx="700.0" cy="494.0" rx="17.0" ry="17.0" fill="#38BDF8" stroke="#0B1220" stroke-width="2.0"/>
<text x="695.0" y="499.0" font-size="12.5" font-weight="700" fill="#0B1220">5</text>
<rect x="250.0" y="644.0" width="560.0" height="105.0" rx="10" fill="#141E36" stroke="#A78BFA" stroke-width="2.0"/>
<text x="262.0" y="666.0" font-size="12.5" font-weight="700" fill="#A78BFA">6 · NETWORK broadcasts it (TLS P2P)</text>
<text x="262.0" y="681.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Nodes gossip the tx over TLS-encrypted connections (P2P port 10101). Within seconds, every</text>
<text x="262.0" y="696.0" font-size="10.5" font-weight="400" fill="#5A6B7A">node has a copy.</text>
<text x="262.0" y="711.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="250.0" cy="644.0" rx="17.0" ry="17.0" fill="#A78BFA" stroke="#0B1220" stroke-width="2.0"/>
<text x="245.0" y="649.0" font-size="12.5" font-weight="700" fill="#0B1220">6</text>
<rect x="830.0" y="644.0" width="560.0" height="105.0" rx="10" fill="#141E36" stroke="#A78BFA" stroke-width="2.0"/>
<text x="842.0" y="666.0" font-size="12.5" font-weight="700" fill="#A78BFA">7 · NETWORK verifies the envelope</text>
<text x="842.0" y="681.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Each node checks signature, zero-knowledge proofs and balance — computed on the ENCRYPTED</text>
<text x="842.0" y="696.0" font-size="10.5" font-weight="400" fill="#5A6B7A">data (homomorphic math) — plus the double-spend check. ≈25 ms.</text>
<text x="842.0" y="711.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="830.0" cy="644.0" rx="17.0" ry="17.0" fill="#A78BFA" stroke="#0B1220" stroke-width="2.0"/>
<text x="825.0" y="649.0" font-size="12.5" font-weight="700" fill="#0B1220">7</text>
<rect x="250.0" y="814.0" width="380.0" height="119.0" rx="10" fill="#141E36" stroke="#FB923C" stroke-width="2.0"/>
<text x="262.0" y="836.0" font-size="12.5" font-weight="700" fill="#FB923C">8 · MINERS race: AstroBWTv3 PoW</text>
<text x="262.0" y="851.0" font-size="10.5" font-weight="400" fill="#5A6B7A">CPU-only, memory-hard puzzle. ASIC/GPU-resistant → any PC can</text>
<text x="262.0" y="866.0" font-size="10.5" font-weight="400" fill="#5A6B7A">mine. Difficulty re-targets every block.</text>
<text x="262.0" y="881.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="250.0" cy="814.0" rx="17.0" ry="17.0" fill="#FB923C" stroke="#0B1220" stroke-width="2.0"/>
<text x="245.0" y="819.0" font-size="12.5" font-weight="700" fill="#0B1220">8</text>
<rect x="650.0" y="814.0" width="380.0" height="134.0" rx="10" fill="#141E36" stroke="#FB923C" stroke-width="2.0"/>
<text x="662.0" y="836.0" font-size="12.5" font-weight="700" fill="#FB923C">9 · MINERS pack the block &amp; earn rewards</text>
<text x="662.0" y="851.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Verified txs are packed into a block — 9 fast mini-blocks + 1</text>
<text x="662.0" y="866.0" font-size="10.5" font-weight="400" fill="#5A6B7A">final (10 per block, one every ~2 sec), so up to 10 miners</text>
<text x="662.0" y="881.0" font-size="10.5" font-weight="400" fill="#5A6B7A">share each reward.</text>
<ellipse cx="650.0" cy="814.0" rx="17.0" ry="17.0" fill="#FB923C" stroke="#0B1220" stroke-width="2.0"/>
<text x="645.0" y="819.0" font-size="12.5" font-weight="700" fill="#0B1220">9</text>
<rect x="1060.0" y="814.0" width="460.0" height="119.0" rx="10" fill="#141E36" stroke="#FB923C" stroke-width="2.0"/>
<text x="1072.0" y="836.0" font-size="12.5" font-weight="700" fill="#FB923C">10 · Block spreads &amp; every node re-checks</text>
<text x="1072.0" y="851.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Erasure-coded into 48 chunks; any 16 rebuild the whole block. All nodes</text>
<text x="1072.0" y="866.0" font-size="10.5" font-weight="400" fill="#5A6B7A">re-validate before accepting. Consensus: one agreed chain.</text>
<text x="1072.0" y="881.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="1060.0" cy="814.0" rx="17.0" ry="17.0" fill="#FB923C" stroke="#0B1220" stroke-width="2.0"/>
<text x="1055.0" y="819.0" font-size="12.5" font-weight="700" fill="#0B1220">10</text>
<rect x="250.0" y="1004.0" width="560.0" height="119.0" rx="10" fill="#141E36" stroke="#2DD4BF" stroke-width="2.0"/>
<text x="262.0" y="1026.0" font-size="12.5" font-weight="700" fill="#2DD4BF">11 · LEDGER updates (still encrypted)</text>
<text x="262.0" y="1041.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Balances settle by homomorphic addition/subtraction on ciphertext — never decrypted, ever.</text>
<text x="262.0" y="1056.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Just 66 bytes per account. Smart contracts (DVM · DeroScript) update encrypted state too.</text>
<text x="262.0" y="1071.0" font-size="10.5" font-weight="400" fill="#5A6B7A"></text>
<ellipse cx="250.0" cy="1004.0" rx="17.0" ry="17.0" fill="#2DD4BF" stroke="#0B1220" stroke-width="2.0"/>
<text x="245.0" y="1009.0" font-size="12.5" font-weight="700" fill="#0B1220">11</text>
<rect x="830.0" y="1004.0" width="430.0" height="120.0" rx="10" fill="#141E36" stroke="#2DD4BF" stroke-width="2.0"/>
<text x="842.0" y="1026.0" font-size="12.5" font-weight="700" fill="#2DD4BF">12 · The record becomes permanent</text>
<text x="842.0" y="1041.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Blocks are chained and merkle-proved. Supply stays auditable (hard cap</text>
<text x="842.0" y="1056.0" font-size="10.5" font-weight="400" fill="#5A6B7A">≈20.89M DERO). History can be pruned to a few GB. The past cannot be</text>
<text x="842.0" y="1071.0" font-size="10.5" font-weight="400" fill="#5A6B7A">rewritten.</text>
<ellipse cx="830.0" cy="1004.0" rx="17.0" ry="17.0" fill="#2DD4BF" stroke="#0B1220" stroke-width="2.0"/>
<text x="825.0" y="1009.0" font-size="12.5" font-weight="700" fill="#0B1220">12</text>
<rect x="1600.0" y="300.0" width="290.0" height="134.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="2.0"/>
<text x="1612.0" y="322.0" font-size="12.5" font-weight="700" fill="#34D399">13 · CONFIRMED in ~1 minute</text>
<text x="1612.0" y="337.0" font-size="10.5" font-weight="400" fill="#5A6B7A">After a few 18-second blocks, your tx is</text>
<text x="1612.0" y="352.0" font-size="10.5" font-weight="400" fill="#5A6B7A">confirmed. Your wallet reads the encrypted</text>
<text x="1612.0" y="367.0" font-size="10.5" font-weight="400" fill="#5A6B7A">balance and decrypts it locally with your key.</text>
<ellipse cx="1600.0" cy="300.0" rx="17.0" ry="17.0" fill="#34D399" stroke="#0B1220" stroke-width="2.0"/>
<text x="1595.0" y="305.0" font-size="12.5" font-weight="700" fill="#0B1220">13</text>
<rect x="1600.0" y="480.0" width="290.0" height="134.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="2.0"/>
<text x="1612.0" y="502.0" font-size="12.5" font-weight="700" fill="#34D399">14 · You get a private receipt</text>
<text x="1612.0" y="517.0" font-size="10.5" font-weight="400" fill="#5A6B7A">Prove ‘I sent exactly X’ without revealing</text>
<text x="1612.0" y="532.0" font-size="10.5" font-weight="400" fill="#5A6B7A">your identity or balance. dApps see their</text>
<text x="1612.0" y="547.0" font-size="10.5" font-weight="400" fill="#5A6B7A">state update too.</text>
<ellipse cx="1600.0" cy="480.0" rx="17.0" ry="17.0" fill="#34D399" stroke="#0B1220" stroke-width="2.0"/>
<text x="1595.0" y="485.0" font-size="12.5" font-weight="700" fill="#0B1220">14</text>
<rect x="1600.0" y="640.0" width="228.0" height="92.0" rx="10" fill="#141E36" stroke="#34D399" stroke-width="2.0"/>
<text x="1612.0" y="662.0" font-size="12.5" font-weight="700" fill="#34D399">✓ CONFIRMED (≈1 MIN)</text>
<text x="1612.0" y="677.0" font-size="10.5" font-weight="400" fill="#5A6B7A">your wallet decrypts</text>
<text x="1612.0" y="692.0" font-size="10.5" font-weight="400" fill="#5A6B7A">your new balance —only you can read it</text>
<rect x="40.0" y="1185.0" width="300.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="52.0" y="1207.0" font-size="12.5" font-weight="700" fill="#26334D">THE WHOLE POINT</text>
<rect x="40.0" y="1210.0" width="1500.0" height="96.0" rx="10" fill="#141E36" stroke="#" stroke-width="1.5"/>
<text x="52.0" y="1232.0" font-size="12.5" font-weight="700" fill="#">Your money never leaves your control. The network never sees your amount, your identity, or your balance — it only agrees, in math, that everything adds up. That is how DERO replaces banks, clouds and databases with one shared, private, tamper-proof notebook.</text>
<rect x="1600.0" y="1185.0" width="200.0" height="22.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="1612.0" y="1207.0" font-size="12.5" font-weight="700" fill="#26334D">LEGEND</text>

<text x="1652.0" y="1235.0" font-size="12.5" font-weight="700" fill="#26334D">👤 YOU — the human</text>
<rect x="1610.0" y="1240.0" width="22.0" height="14.0" rx="10" fill="#34D399" stroke="none" stroke-width="1.4"/>
<rect x="1640.0" y="1237.0" width="240.0" height="18.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
<text x="1652.0" y="1259.0" font-size="12.5" font-weight="700" fill="#26334D">💼 YOUR WALLET — the app</text>
<rect x="1610.0" y="1264.0" width="22.0" height="14.0" rx="10" fill="#38BDF8" stroke="none" stroke-width="1.4"/>
<rect x="1640.0" y="1261.0" width="240.0" height="18.0" rx="10" fill="#FFFFFF" stroke="#26334D" stroke-width="1.4"/>
